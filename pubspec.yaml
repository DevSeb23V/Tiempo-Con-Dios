name: tiempo_con_dios
description: "Tiempo con Dios - Una aplicación minimalista para proteger tu momento sagrado del día."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  table_calendar: ^3.1.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F3EA"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#F7F3EA"
  image: assets/icons/splash_icon.png
  android_12:
    image: assets/icons/splash_icon.png
    icon_background_color: "#F7F3EA"
    color: "#F7F3EA"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
